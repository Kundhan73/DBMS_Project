# PostgreSQL 16 with pgvector preinstalled, for local development.
#   docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aptmgr
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: aptmgr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
